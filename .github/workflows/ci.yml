name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Unit tests (AstrBot-dependent modules are skipped)
        working-directory: .
        run: python -m unittest discover -s tests -v

      - name: Build release package
        run: python tools/build_release.py --force

      - name: Verify release package
        run: python tools/verify_release.py --skip-import

      - name: 对外文案扫描（不允许出现其它项目名）
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          targets = [root / "README.md", root / "metadata.yaml", root / "_conf_schema.json",
                     root / "CHANGELOG.md", root / "pages" / "bili-panel" / "index.html"]
          pattern = re.compile(r"dsh-bili-scroll|c1overzz|humanizer|mnemoria|bilibili-mcp|AGI_Ananas", re.I)
          hits = []
          for path in targets:
              if path.exists() and pattern.search(path.read_text(encoding="utf-8")):
                  hits.append(str(path))
          if hits:
              print("发现其它项目名：", hits)
              sys.exit(1)
          print("文案扫描通过")
          PY
