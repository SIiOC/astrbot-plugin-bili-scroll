name: Release

# 推送 v* tag 时自动构建发布包并上传 GitHub Release 附件。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve version
        id: ver
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.search(r'^version:\\s*(.+)$', pathlib.Path('metadata.yaml').read_text(encoding='utf-8'), re.M).group(1).strip())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release package
        run: python tools/build_release.py --force

      - name: Verify release package
        run: python tools/verify_release.py --skip-import

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          body: |
            刷会儿B站 ${{ steps.ver.outputs.version }}。
            详见仓库 CHANGELOG.md。
          files: |
            release/astrbot_plugin_bili_scroll-${{ steps.ver.outputs.version }}.zip
            release/astrbot_plugin_bili_scroll-${{ steps.ver.outputs.version }}.zip.sha256
